<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>○○ CAFE - Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Noto+Serif+JP:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ivory: #f7f3ec;
    --cream: #ede8df;
    --sand: #d4c9b5;
    --taupe: #b5a48e;
    --brown: #7c6347;
    --espresso: #3d2b1a;
    --gold: #c9a96e;
    --gold-light: #e8d5a3;
    --white: #fdfaf6;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Noto Serif JP', serif;
    background: var(--espresso);
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  /* 木目風背景レイヤー */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(
        92deg,
        transparent 0px,
        transparent 3px,
        rgba(255,255,255,0.012) 3px,
        rgba(255,255,255,0.012) 6px
      ),
      repeating-linear-gradient(
        88deg,
        transparent 0px,
        transparent 8px,
        rgba(0,0,0,0.04) 8px,
        rgba(0,0,0,0.04) 16px
      ),
      linear-gradient(
        175deg,
        #2a1a0e 0%,
        #3d2b1a 30%,
        #4a3220 60%,
        #3a2518 100%
      );
    z-index: 0;
    pointer-events: none;
  }

  /* ノイズテクスチャ */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }

  /* ヘッダー */
  header {
    position: relative;
    z-index: 10;
    padding: 0 48px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(201,169,110,0.3);
    background: rgba(20,10,5,0.4);
    backdrop-filter: blur(8px);
  }

  /* 左：ロゴエリア */
  .logo-area {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* ロゴプレースホルダー（実際の画像に差し替え可） */
  .logo-img {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold) 0%, var(--brown) 100%);
    border: 1px solid rgba(201,169,110,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--ivory);
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .logo-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--gold-light);
    letter-spacing: 4px;
    font-weight: 400;
    line-height: 1;
  }

  .logo-sub {
    font-size: 0.55rem;
    letter-spacing: 5px;
    color: var(--taupe);
    text-transform: uppercase;
    font-family: 'Cormorant Garamond', serif;
  }

  /* 右：日時 + 同期 */
  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .datetime {
    text-align: right;
  }

  .time-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: var(--gold);
    letter-spacing: 3px;
    line-height: 1;
  }

  .date-display {
    font-size: 0.6rem;
    color: var(--taupe);
    letter-spacing: 3px;
    margin-top: 2px;
  }

  .sync-indicator {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #555;
    transition: all 0.4s;
  }
  .sync-indicator.connected {
    background: #8fc97f;
    box-shadow: 0 0 10px rgba(143,201,127,0.6);
    animation: breathe 3s ease infinite;
  }

  /* メインコンテンツ */
  .content {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    height: 100%;
  }

  /* 左：現在番号 */
  .left-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
    position: relative;
    border-right: 1px solid rgba(201,169,110,0.15);
  }

  /* コーナー装飾 */
  .corner {
    position: absolute;
    width: 32px; height: 32px;
    border-color: rgba(201,169,110,0.4);
    border-style: solid;
  }
  .corner-tl { top: 24px; left: 24px; border-width: 1px 0 0 1px; }
  .corner-tr { top: 24px; right: 24px; border-width: 1px 1px 0 0; }
  .corner-bl { bottom: 24px; left: 24px; border-width: 0 0 1px 1px; }
  .corner-br { bottom: 24px; right: 24px; border-width: 0 1px 1px 0; }

  .calling-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(0.9rem, 1.8vw, 1.2rem);
    color: var(--taupe);
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 16px;
    font-style: italic;
  }

  .gold-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 24px;
  }

  .main-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(9rem, 22vw, 16rem);
    color: var(--ivory);
    letter-spacing: 8px;
    line-height: 1;
    text-shadow:
      0 0 60px rgba(201,169,110,0.15),
      0 2px 4px rgba(0,0,0,0.4);
  }
  .main-number.pulse { animation: numPulse 0.8s ease; }

  .num-suffix {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 16px;
  }

  .num-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,169,110,0.4));
  }
  .num-line.right {
    background: linear-gradient(90deg, rgba(201,169,110,0.4), transparent);
  }

  .num-unit {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(1rem, 2.2vw, 1.5rem);
    color: var(--gold);
    letter-spacing: 6px;
    font-weight: 200;
  }

  .sub-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(0.85rem, 1.6vw, 1.1rem);
    color: var(--taupe);
    letter-spacing: 5px;
    margin-top: 20px;
    font-style: italic;
  }

  .notice-pill {
    margin-top: 32px;
    padding: 10px 28px;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(0.75rem, 1.4vw, 0.95rem);
    letter-spacing: 4px;
    display: none;
    font-weight: 200;
    animation: pillFlash 2s ease infinite;
    position: relative;
    overflow: hidden;
  }
  .notice-pill::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(201,169,110,0.08);
  }
  .notice-pill.show { display: block; }

  /* 右：履歴パネル */
  .right-panel {
    display: flex;
    flex-direction: column;
    padding: 32px 28px;
    gap: 20px;
    background: rgba(0,0,0,0.15);
  }

  .history-header {
    text-align: center;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(201,169,110,0.2);
  }

  .history-title {
    font-family: 'Playfair Display', serif;
    font-size: 0.8rem;
    letter-spacing: 6px;
    color: var(--taupe);
    text-transform: uppercase;
    font-style: italic;
  }

  .hist-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    align-content: start;
    flex: 1;
  }

  .hist-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,169,110,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 8px;
    position: relative;
    transition: all 0.4s ease;
  }

  .hist-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.6rem, 3.5vw, 2.8rem);
    color: rgba(181,164,142,0.4);
    letter-spacing: 4px;
  }

  .hist-box.latest {
    background: rgba(201,169,110,0.08);
    border-color: rgba(201,169,110,0.5);
  }
  .hist-box.latest .hist-num {
    color: var(--gold);
    text-shadow: 0 0 30px rgba(201,169,110,0.3);
  }
  .hist-box.latest::after { display: none; }
    font-family: 'Noto Serif JP', serif;
  }

  .hist-box.recent {
    border-color: rgba(201,169,110,0.25);
  }
  .hist-box.recent .hist-num { color: rgba(181,164,142,0.7); }

  /* 画像エリア（下部） */
  .image-area {
    margin-top: auto;
    border-top: 1px solid rgba(201,169,110,0.15);
    padding-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  /* 画像プレースホルダー（実際の画像に差し替え可） */
  .cafe-image {
    width: 100%;
    height: 100px;
    background: linear-gradient(135deg,
      rgba(61,43,26,0.6) 0%,
      rgba(124,99,71,0.3) 50%,
      rgba(61,43,26,0.6) 100%
    );
    border: 1px solid rgba(201,169,110,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .cafe-image::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(45deg,
        transparent 0px, transparent 10px,
        rgba(201,169,110,0.03) 10px, rgba(201,169,110,0.03) 11px
      );
  }

  .image-placeholder-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.7rem;
    letter-spacing: 4px;
    color: rgba(181,164,142,0.4);
    font-style: italic;
    position: relative;
    z-index: 1;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.65rem;
    letter-spacing: 4px;
    color: rgba(181,164,142,0.35);
    text-align: center;
    font-style: italic;
  }

  /* アニメーション */
  @keyframes numPulse {
    0%   { opacity: 1; transform: scale(1); }
    20%  { opacity: 0.6; transform: scale(1.04); color: var(--gold); }
    50%  { opacity: 1; transform: scale(0.98); }
    100% { transform: scale(1); color: var(--ivory); }
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  @keyframes pillFlash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <!-- ロゴ画像はここに差し込む: <img src="logo.png" class="logo-img"> -->
    <div class="logo-img">○○</div>
    <div class="logo-text">
      <div class="logo-name">○○ Cafe</div>
      <div class="logo-sub">Order & Pickup System</div>
    </div>
  </div>
  <div class="header-right">
    <div class="datetime">
      <div class="time-display" id="timeDisplay">--:--</div>
      <div class="date-display" id="dateDisplay">---- / -- / --</div>
    </div>
    <div class="sync-indicator" id="syncDot"></div>
  </div>
</header>

<div class="content">

  <div class="left-panel">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="calling-label">Now Calling</div>
    <div class="gold-line"></div>
    <div class="main-number" id="monitorNum">---</div>
    <div class="num-suffix">
      <div class="num-line"></div>
      <div class="num-unit">番</div>
      <div class="num-line right"></div>
    </div>
    <div class="sub-text">をお呼びしています</div>
    <div class="notice-pill" id="monitorNotice">カウンターまでお越しください</div>
  </div>

  <div class="right-panel">
    <div class="history-header">
      <div class="history-title">Call History</div>
    </div>

    <div class="hist-grid" id="monitorHistory"></div>

    <div class="image-area">
      <!-- カフェ画像をここに差し込む: <img src="cafe.jpg" style="width:100%;height:100px;object-fit:cover;"> -->
      <div class="cafe-image">
        <div class="image-placeholder-text">cafe image here</div>
      </div>
      <div class="tagline">Thank you for visiting ○○ Cafe</div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

  const app = initializeApp({ databaseURL: 'https://yobidashi-poc-default-rtdb.firebaseio.com/' });
  const db = getDatabase(app);

  function pad(n) { return String(n).padStart(3, '0'); }

  // 時計
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('timeDisplay').textContent = `${h}:${m}`;
    document.getElementById('dateDisplay').textContent =
      `${now.getFullYear()} / ${String(now.getMonth()+1).padStart(2,'0')} / ${String(now.getDate()).padStart(2,'0')}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  onValue(ref(db, '.info/connected'), (snap) => {
    document.getElementById('syncDot').className = 'sync-indicator' + (snap.val() ? ' connected' : '');
  });

  let selectedVoiceName = null;
  let callMessage = 'ただいま、{番号}番のお客様、カウンターまでお越しください';

  // 音声・メッセージ設定を監視
  onValue(ref(db, 'voiceSettings'), (snap) => {
    const data = snap.val();
    selectedVoiceName = data?.name || null;
    if (data?.message) callMessage = data.message;
  });

  function getVoice() {
    const voices = speechSynthesis.getVoices();
    if (selectedVoiceName) {
      return voices.find(v => v.name === selectedVoiceName) || null;
    }
    return null;
  }

  let displayHistory = [];

  // 履歴は別パスで監視（音を鳴らさずに更新）
  onValue(ref(db, 'history'), (snap) => {
    displayHistory = snap.val() || [];
    document.getElementById('monitorHistory').innerHTML =
      displayHistory.slice(1).map((n, i) => `
        <div class="hist-box ${i === 0 ? 'latest' : i <= 2 ? 'recent' : ''}">
          <span class="hist-num">${pad(n)}</span>
        </div>
      `).join('');
  });

  onValue(ref(db, 'current'), (snap) => {
    const data = snap.val();
    if (!data) {
      document.getElementById('monitorNum').textContent = '---';
      document.getElementById('monitorHistory').innerHTML = '';
      document.getElementById('monitorNotice').classList.remove('show');
      return;
    }

    const el = document.getElementById('monitorNum');
    el.textContent = pad(data.num);
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');

    document.getElementById('monitorNotice').classList.add('show');

    // ポロロン系チャイム（ハープっぽく流れる）
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function playHarp(freq, start) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(0.22, ctx.currentTime + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + 1.2);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + 1.4);
    }
    // ドレミソラ と流れるアルペジオ
    playHarp(523, 0.0);   // ド
    playHarp(587, 0.12);  // レ
    playHarp(659, 0.24);  // ミ
    playHarp(784, 0.36);  // ソ
    playHarp(880, 0.48);  // ラ
    playHarp(1047, 0.65); // 高ド
    playHarp(880, 0.85);  // ラ（戻る）
    playHarp(784, 1.05);  // ソ（余韻）

    setTimeout(() => {
      speechSynthesis.cancel();
      const text = callMessage.replace('{番号}', data.num);
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'ja-JP';
      msg.rate = 1.1;
      msg.pitch = 1.1;
      msg.volume = 1.0;
      const voice = getVoice();
      if (voice) msg.voice = voice;
      speechSynthesis.speak(msg);
    }, 2500);
  });
</script>
</body>
</html>
